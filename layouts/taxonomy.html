{{ define "main" }}
<section class="section-mb">
  <h1 class="page-title">{{ .Title }}</h1>

  <div class="tag-cloud">
    {{ range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}" class="tag-cloud__link">
      #{{ .Page.Title }}
      <span class="tag-cloud__count">({{ .Count }})</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
